<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Estudantes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5 bg-light" style="border:1px solid ; background-color:#1111; border-radius: 10px;">
    <h1 class="m-4 text-center">Registros de Estudantes 
        <br>
        <a href="/adicionar/" class="btn btn-primary">Adicionar Estudante</a>
    </h1>
    <table class="table table-bordered">
        <tr class="bg-info text-white text-center ">
            <td> ID  </td>
            <td> Nome </td>
            <td> Foto  </td>
            <td> Email </td>
            <td> Senha </td>
            <td> Telefone </td>
            <td> Curso</td>
            <td> Nascimento</td>
            <td> Ações </td>
        </tr>
        {% for est in listaEst %}
        <tr class="text-center">
            <td>{{ forloop.counter }}</td>
            <td>{{ est.nome }}</td>
            <td><img src="/midia/{{ reg.foto }}"class="rounded-circle" height="70px" width="70px"></td>
            <td>{{ est.email}}</td>
            <td>{{ est.senha}}</td>
            <td>{{ est.telefone}}</td>
            <td>{{ est.nascimento}} </td> 
            <td> <a href="/editar/{{est.id}}" class="btn btn-success">Editar</a>/
                <a href="/deletar/{{est.id}}" class="btn btn-danger">Apagar</a>/
                <a href="/visualizar/{{est.id}}" class="btn btn-primary">Ver</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
